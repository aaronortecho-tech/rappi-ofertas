name: Monitor de ofertas Rappi

on:
  schedule:
    # Cada 30 minutos (GitHub usa hora UTC y a veces se atrasa unos minutos).
    # Si cambias la frecuencia, cambia también MINUTOS_ENTRE_RONDAS más abajo.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar al celular una notificación de prueba"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monitor-ofertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          ref: main
          # Necesario para guardar la memoria del monitor al final.
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y navegador
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps --only-shell chromium

      - name: Revisar ofertas
        env:
          # Secretos (Settings → Secrets and variables → Actions → Secrets)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RAPPI_UBICACION: ${{ secrets.RAPPI_UBICACION }}
          # Ajustes opcionales (Settings → Secrets and variables → Actions → Variables)
          DESCUENTO_MINIMO: ${{ vars.DESCUENTO_MINIMO }}
          ALARMA_DESDE: ${{ vars.ALARMA_DESDE }}
          HORAS_SILENCIO: ${{ vars.HORAS_SILENCIO }}
          RAPPI_PRO: ${{ vars.RAPPI_PRO }}
          DISTANCIA_MAXIMA_KM: ${{ vars.DISTANCIA_MAXIMA_KM }}
          TIPOS_TIENDA: ${{ vars.TIPOS_TIENDA }}
          TIENDAS_POR_RONDA: ${{ vars.TIENDAS_POR_RONDA }}
          CADENAS: ${{ vars.CADENAS }}
          REPETIR_AVISO_HORAS: ${{ vars.REPETIR_AVISO_HORAS }}
          MAX_AVISOS_POR_RONDA: ${{ vars.MAX_AVISOS_POR_RONDA }}
          REVISAR_TIENDAS: ${{ vars.REVISAR_TIENDAS }}
          REVISAR_RAPPI_MARKET: ${{ vars.REVISAR_RAPPI_MARKET }}
          REVISAR_RESTAURANTES: ${{ vars.REVISAR_RESTAURANTES }}
          DETALLE_EN_LOGS: ${{ vars.DETALLE_EN_LOGS }}
          MINUTOS_ENTRE_RONDAS: "30"
          MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && 'si' || 'no' }}
        run: python -m monitor

      - name: Guardar la memoria del monitor
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain -- state)" ]; then
            echo "La memoria no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit --quiet -m "Actualizar memoria del monitor"
          for intento in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::No se pudo guardar la memoria del monitor."
          exit 1
