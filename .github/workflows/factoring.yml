name: Factoring con evidencia completa
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor-ofertas
  cancel-in-progress: false
jobs:
  factoring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Consultar anuncios y evaluar fichas completas
        env:
          NTFY_TOPIC_FACTORING: ${{ secrets.NTFY_TOPIC_FACTORING }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          HORAS_SILENCIO: ${{ vars.HORAS_SILENCIO }}
          FACTORING_PROFILE_JSON: ${{ secrets.FACTORING_PROFILE_JSON }}
          FACTORING_REVIEWS_JSON: ${{ secrets.FACTORING_REVIEWS_JSON }}
        run: python -m monitor.factoring
      - name: Guardar solo métricas y deduplicación
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain -- state/factoring.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/factoring.json
          git commit --quiet -m "Actualizar métricas públicas de factoring"
          for intento in 1 2 3 4 5; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep 10
          done
          exit 1
