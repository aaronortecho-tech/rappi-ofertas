name: Recuperar historial observado
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor-ofertas
  cancel-in-progress: false
jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recuperar observaciones sin cambiar avisos ni cursores
        run: python scripts/recover_price_history.py
      - name: Guardar recuperación
        run: |
          if [ -z "$(git status --porcelain -- state/hogar.json state/state.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/hogar.json state/state.json
          git commit --quiet -m "Recuperar observaciones reales de precios"
          for intento in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep 5
          done
          exit 1
